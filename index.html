<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regalo con Margaritas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #fbfcff;
      --bg2: #edf2f8;
      --bg3: #dce7ef;

      --box1: #a9c7d8;
      --box2: #6f9eb5;
      --box3: #486f83;

      --ribbon1: #fffef7;
      --ribbon2: #e9e0b8;
      --ribbon3: #c6b875;

      --stem1: #5b8e4f;
      --stem2: #2f6534;

      --leaf1: #7eb36a;
      --leaf2: #4f8548;
      --leaf3: #2f5b31;

      --petal1: #ffffff;
      --petal2: #f1f4f7;
      --petal3: #dfe6ec;

      --center1: #ffd85b;
      --center2: #d8a526;
      --center3: #8e6818;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.95), transparent 26%),
        radial-gradient(circle at 28% 14%, rgba(200,224,239,.55), transparent 24%),
        radial-gradient(circle at 72% 16%, rgba(240,231,188,.35), transparent 24%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 56%, var(--bg3));
      perspective: 1200px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .23;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(52,76,92,.02) 0 1px,
          transparent 1px 4px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.13) 0 1px,
          transparent 1px 5px
        );
      mix-blend-mode: multiply;
    }

    .scene {
      position: relative;
      width: min(92vw, 720px);
      height: min(94vh, 860px);
      transform-style: preserve-3d;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .floor-shadow {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 52%;
      height: 8%;
      transform: translateX(-50%) rotateX(72deg);
      border-radius: 50%;
      background: rgba(56,72,82,.24);
      filter: blur(24px);
      transition: all .9s ease;
    }

    .scene.open .floor-shadow {
      width: 61%;
      opacity: .9;
    }

    /* =========================
       RAMO DE MARGARITAS
       ========================= */

    .bouquet {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 460px;
      height: 500px;
      transform: translateX(-50%) translateY(235px) scale(.62);
      transform-origin: 50% 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      transition:
        transform 1.18s cubic-bezier(.18,.82,.22,1.1),
        opacity .55s ease .2s;
    }

    .scene.open .bouquet {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 7px;
      height: 300px;
      border-radius: 999px;
      transform-origin: bottom center;
      background:
        linear-gradient(
          90deg,
          #173919 0%,
          var(--stem2) 28%,
          var(--stem1) 50%,
          #3d743e 72%,
          #173419 100%
        );
      box-shadow:
        inset 1px 0 rgba(255,255,255,.18),
        2px 3px 5px rgba(0,0,0,.11);
    }

    .s1 { transform: translateX(-118px) rotate(-19deg); }
    .s2 { transform: translateX(-84px) rotate(-13deg); }
    .s3 { transform: translateX(-52px) rotate(-8deg); }
    .s4 { transform: translateX(-16px) rotate(-2deg); }
    .s5 { transform: translateX(18px) rotate(5deg); }
    .s6 { transform: translateX(53px) rotate(10deg); }
    .s7 { transform: translateX(86px) rotate(15deg); }
    .s8 { transform: translateX(116px) rotate(19deg); }
    .s9 { transform: translateX(-132px) rotate(-23deg) scaleY(.92); }

    .leaf {
      position: absolute;
      width: 84px;
      height: 30px;
      border-radius: 100% 0 100% 0;
      transform-origin: 0 50%;
      background:
        radial-gradient(circle at 68% 28%, rgba(255,255,255,.18), transparent 20%),
        linear-gradient(145deg, var(--leaf1), var(--leaf2) 55%, var(--leaf3));
      box-shadow:
        inset 0 1px rgba(255,255,255,.14),
        3px 5px 7px rgba(0,0,0,.10);
      overflow: hidden;
    }

    .leaf::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 50%;
      width: 84%;
      height: 1px;
      background: rgba(235,255,223,.34);
      transform: rotate(-18deg);
      transform-origin: left;
    }

    .l1 { left: 119px; bottom: 129px; transform: rotate(-155deg); }
    .l2 { left: 165px; bottom: 195px; transform: rotate(-29deg) scale(.92); }
    .l3 { left: 235px; bottom: 116px; transform: rotate(18deg); }
    .l4 { left: 255px; bottom: 185px; transform: rotate(26deg) scale(.88); }
    .l5 { left: 96px; bottom: 232px; transform: rotate(-149deg) scale(.78); }
    .l6 { left: 281px; bottom: 248px; transform: rotate(31deg) scale(.74); }

    .flower {
      --size: 118px;
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform-style: preserve-3d;
      filter: drop-shadow(0 10px 8px rgba(64,73,79,.12));
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 29%;
      height: 58%;
      border-radius: 58% 58% 48% 48%;
      transform-origin: 50% 88%;
      background:
        radial-gradient(circle at 38% 22%, rgba(255,255,255,.96), transparent 17%),
        linear-gradient(180deg, var(--petal1), var(--petal2) 60%, var(--petal3));
      box-shadow:
        inset 4px 7px 9px rgba(255,255,255,.48),
        inset -5px -7px 9px rgba(110,126,136,.12),
        0 3px 5px rgba(79,92,101,.10);
    }

    .petal::after {
      content: "";
      position: absolute;
      inset: 10% 18%;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(160,176,187,.08) 0 1px,
          transparent 1px 5px
        );
      opacity: .7;
    }

    .p1  { transform: translate(-50%, -100%) rotate(0deg)   rotateX(16deg); }
    .p2  { transform: translate(-50%, -100%) rotate(30deg)  rotateX(16deg); }
    .p3  { transform: translate(-50%, -100%) rotate(60deg)  rotateX(16deg); }
    .p4  { transform: translate(-50%, -100%) rotate(90deg)  rotateX(16deg); }
    .p5  { transform: translate(-50%, -100%) rotate(120deg) rotateX(16deg); }
    .p6  { transform: translate(-50%, -100%) rotate(150deg) rotateX(16deg); }
    .p7  { transform: translate(-50%, -100%) rotate(180deg) rotateX(16deg); }
    .p8  { transform: translate(-50%, -100%) rotate(210deg) rotateX(16deg); }
    .p9  { transform: translate(-50%, -100%) rotate(240deg) rotateX(16deg); }
    .p10 { transform: translate(-50%, -100%) rotate(270deg) rotateX(16deg); }
    .p11 { transform: translate(-50%, -100%) rotate(300deg) rotateX(16deg); }
    .p12 { transform: translate(-50%, -100%) rotate(330deg) rotateX(16deg); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30%;
      height: 30%;
      transform: translate(-50%, -50%) translateZ(16px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, #fff39f 0 5%, transparent 6%),
        radial-gradient(circle at 68% 34%, #efbf39 0 5%, transparent 6%),
        radial-gradient(circle at 42% 68%, #c18e1c 0 5%, transparent 6%),
        repeating-radial-gradient(
          circle at 50% 50%,
          var(--center1) 0 3px,
          var(--center2) 3px 6px,
          var(--center3) 6px 8px
        );
      box-shadow:
        inset 3px 4px 5px rgba(255,255,255,.28),
        inset -5px -6px 7px rgba(98,68,8,.20),
        0 4px 6px rgba(88,64,12,.20);
    }

    .f1 { --size: 136px; left: 160px; top: 8px; transform: rotate(-3deg) translateZ(35px); z-index: 10; }
    .f2 { --size: 124px; left: 68px; top: 74px; transform: rotate(-10deg) translateZ(18px); z-index: 8; }
    .f3 { --size: 124px; right: 68px; top: 76px; transform: rotate(10deg) translateZ(20px); z-index: 8; }
    .f4 { --size: 115px; left: 18px; top: 154px; transform: rotate(-17deg) translateZ(10px); z-index: 6; }
    .f5 { --size: 132px; left: 165px; top: 143px; transform: rotate(2deg) translateZ(38px); z-index: 11; }
    .f6 { --size: 115px; right: 18px; top: 154px; transform: rotate(17deg) translateZ(10px); z-index: 6; }
    .f7 { --size: 106px; left: 92px; top: 228px; transform: rotate(-7deg) translateZ(18px); z-index: 7; }
    .f8 { --size: 106px; right: 92px; top: 230px; transform: rotate(7deg) translateZ(18px); z-index: 7; }
    .f9 { --size: 98px; left: 181px; top: 268px; transform: rotate(1deg) translateZ(28px); z-index: 9; }

    /* =========================
       CAJA 3D
       ========================= */

    .gift {
      position: absolute;
      left: 50%;
      bottom: 9%;
      width: 280px;
      height: 260px;
      transform: translateX(-50%);
      transform-style: preserve-3d;
      z-index: 20;
      cursor: pointer;
      outline: none;
    }

    .gift:focus-visible {
      filter: drop-shadow(0 0 .6rem rgba(150,191,214,.75));
    }

    .box {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 240px;
      height: 175px;
      transform: translateX(-50%);
      border-radius: 5px 5px 14px 14px;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(41,69,83,.13),
          transparent 18% 82%,
          rgba(41,69,83,.17)
        ),
        repeating-linear-gradient(
          115deg,
          rgba(255,255,255,.05) 0 1px,
          transparent 1px 7px
        ),
        linear-gradient(145deg, var(--box1), var(--box2) 58%, var(--box3));
      box-shadow:
        inset 7px 0 12px rgba(255,255,255,.17),
        inset -10px -8px 14px rgba(35,59,72,.18),
        0 22px 28px rgba(44,66,78,.22);
    }

    .box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 52px;
      height: 100%;
      transform: translateX(-50%);
      background:
        linear-gradient(
          90deg,
          var(--ribbon3),
          var(--ribbon1) 28%,
          var(--ribbon2) 58%,
          #b19f5f
        );
      box-shadow:
        inset 5px 0 7px rgba(255,255,255,.16),
        inset -5px 0 7px rgba(77,67,35,.13);
    }

    .box::after {
      content: "";
      position: absolute;
      left: 0;
      top: 44%;
      width: 100%;
      height: 40px;
      background:
        linear-gradient(
          180deg,
          #b8aa70,
          var(--ribbon1) 26%,
          var(--ribbon2) 60%,
          var(--ribbon3)
        );
      box-shadow:
        inset 0 4px 6px rgba(255,255,255,.12),
        inset 0 -4px 7px rgba(74,63,35,.12);
    }

    .lid {
      position: absolute;
      left: 50%;
      bottom: 159px;
      width: 270px;
      height: 63px;
      transform-origin: 20% 85%;
      transform: translateX(-50%) translateZ(18px);
      border-radius: 10px;
      z-index: 5;
      transition:
        transform 1.05s cubic-bezier(.22,.8,.25,1.05),
        filter .7s ease;
      background:
        linear-gradient(
          90deg,
          rgba(43,70,84,.11),
          transparent 18% 82%,
          rgba(43,70,84,.15)
        ),
        repeating-linear-gradient(
          112deg,
          rgba(255,255,255,.05) 0 1px,
          transparent 1px 7px
        ),
        linear-gradient(145deg, #c2d9e5, #89afc2 60%, #567f93);
      box-shadow:
        inset 6px 7px 10px rgba(255,255,255,.20),
        inset -8px -8px 11px rgba(42,67,80,.17),
        0 12px 14px rgba(44,66,77,.19);
    }

    .lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 55px;
      height: 100%;
      transform: translateX(-50%);
      background:
        linear-gradient(
          90deg,
          var(--ribbon3),
          var(--ribbon1) 28%,
          var(--ribbon2) 56%,
          #b29e5d
        );
    }

    .lid::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 18px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          180deg,
          #b8aa70,
          var(--ribbon1) 28%,
          var(--ribbon2) 58%,
          var(--ribbon3)
        );
    }

    .bow {
      position: absolute;
      left: 50%;
      bottom: 210px;
      width: 124px;
      height: 74px;
      transform: translateX(-50%) translateZ(30px);
      z-index: 7;
      transition: transform 1.05s cubic-bezier(.22,.8,.25,1.05);
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 64px;
      height: 47px;
      border-radius: 52% 48% 56% 44%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.35), transparent 24%),
        linear-gradient(145deg, var(--ribbon1), var(--ribbon2) 58%, var(--ribbon3));
      box-shadow:
        inset -7px -7px 10px rgba(76,67,38,.13),
        0 6px 8px rgba(70,62,40,.12);
    }

    .bow::before {
      left: 4px;
      transform: rotate(22deg);
    }

    .bow::after {
      right: 4px;
      transform: rotate(-22deg);
    }

    .knot {
      position: absolute;
      left: 50%;
      top: 19px;
      width: 36px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 50%;
      z-index: 3;
      background:
        radial-gradient(circle at 35% 30%, #fffef8, #ddd4a4 55%, #b9aa6b);
      box-shadow:
        inset -5px -6px 8px rgba(76,67,38,.15),
        0 4px 6px rgba(67,58,34,.12);
    }

    .gift:hover .lid,
    .gift:hover .bow {
      filter: brightness(1.035);
    }

    .gift:hover {
      animation: tiny-bounce .75s ease-in-out infinite alternate;
    }

    @keyframes tiny-bounce {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(-4px); }
    }

    .scene.open .gift {
      animation: none;
      cursor: default;
    }

    .scene.open .lid {
      transform:
        translateX(-50%)
        translate(-105px, -62px)
        rotateZ(-18deg)
        rotateY(-24deg)
        rotateX(16deg)
        translateZ(36px);
    }

    .scene.open .bow {
      transform:
        translateX(-50%)
        translate(-104px, -65px)
        rotateZ(-18deg)
        rotateY(-24deg)
        rotateX(16deg)
        translateZ(48px);
    }

    .glow {
      position: absolute;
      left: 50%;
      bottom: 155px;
      width: 250px;
      height: 175px;
      transform: translateX(-50%) scale(.35);
      border-radius: 50%;
      opacity: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(
          circle,
          rgba(255,249,196,.76),
          rgba(188,221,240,.28) 38%,
          transparent 72%
        );
      filter: blur(6px);
      transition:
        opacity .8s ease .15s,
        transform 1s ease .15s;
    }

    .scene.open .glow {
      opacity: 1;
      transform: translateX(-50%) scale(1.35);
    }

    .spark {
      position: absolute;
      left: 50%;
      bottom: 210px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      opacity: 0;
      z-index: 12;
      pointer-events: none;
      background: #fff2a2;
      box-shadow: 0 0 12px #fff7c9;
    }

    .scene.open .spark {
      animation: sparkle 1.8s ease-out forwards;
    }

    .sp1 { --x: -150px; --y: -200px; animation-delay: .28s !important; }
    .sp2 { --x: -95px;  --y: -278px; animation-delay: .40s !important; }
    .sp3 { --x: -30px;  --y: -320px; animation-delay: .22s !important; }
    .sp4 { --x: 52px;   --y: -305px; animation-delay: .34s !important; }
    .sp5 { --x: 112px;  --y: -248px; animation-delay: .48s !important; }
    .sp6 { --x: 156px;  --y: -178px; animation-delay: .30s !important; }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(.2);
      }
      22% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), var(--y)) scale(1.45);
      }
    }

    @media (max-width: 620px) {
      .scene {
        transform: scale(.88);
      }
    }

    @media (max-height: 720px) {
      .scene {
        transform: scale(.8);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gift,
      .lid,
      .bow,
      .bouquet,
      .spark,
      .glow {
        animation: none !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene" id="scene">
    <div class="floor-shadow"></div>
    <div class="glow"></div>

    <span class="spark sp1"></span>
    <span class="spark sp2"></span>
    <span class="spark sp3"></span>
    <span class="spark sp4"></span>
    <span class="spark sp5"></span>
    <span class="spark sp6"></span>

    <section class="bouquet" aria-hidden="true">
      <div class="stem s1"></div>
      <div class="stem s2"></div>
      <div class="stem s3"></div>
      <div class="stem s4"></div>
      <div class="stem s5"></div>
      <div class="stem s6"></div>
      <div class="stem s7"></div>
      <div class="stem s8"></div>

      <div class="leaf l1"></div>

      <div class="leaf l3"></div>

      <!-- Margarita 1 -->
      <div class="flower f1">

        <span class="center"></span>
      </div>

      <!-- Margarita 2 -->
      <div class="flower f2">
        <span class="petal p1"></span><span class="petal p2"></span>

        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>

      </div>

      <!-- Margarita 3 -->
      <div class="flower f3">
        <span class="petal p1"></span><span class="petal p2"></span>

        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>

        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <div class="flower f4">
        <span class="petal p1"></span><span class="petal p2"></span>

        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <!-- Margarita 5 -->
      <div class="flower f5">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <!-- Margarita 6 -->
      <div class="flower f6">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <!-- Margarita 7 -->
      <div class="flower f7">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <!-- Margarita 8 -->
      <div class="flower f8">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>

      <!-- Margarita 9 -->
      <div class="flower f9">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="petal p9"></span><span class="petal p10"></span>
        <span class="petal p11"></span><span class="petal p12"></span>
        <span class="center"></span>
      </div>
    </section>

    <div
      class="gift"
      id="gift"
      role="button"
      tabindex="0"
      aria-label="Abrir regalo"
      aria-expanded="false"
    >
      <div class="lid"></div>

      <div class="bow">
        <div class="knot"></div>
      </div>

      <div class="box"></div>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const gift = document.getElementById("gift");

    function openGift() {
      if (scene.classList.contains("open")) return;

      scene.classList.add("open");
      gift.setAttribute("aria-expanded", "true");
    }

    gift.addEventListener("click", openGift);

    gift.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openGift();
      }
    });
  </script>
</body>
</html>
